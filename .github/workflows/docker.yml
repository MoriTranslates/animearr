name: Docker image

# Multi-arch image (linux/amd64 + linux/arm64) on GitHub Container Registry.
# - Tags v*: pushed as :<version> (e.g. :0.9.0-beta), plus :beta for pre-releases and :latest for stable releases.
# - Pull requests: built for both platforms, not pushed (a build check).
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/animearr

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=AnimeArr
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64 --load -t animearr:test .
          docker run -d --name smoke -e PUID=1000 -e PGID=1000 -p 8484:8484 animearr:test
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8484/ping && break; sleep 2; done
          curl -fs http://127.0.0.1:8484/ping
          docker exec smoke sh -c 'ffprobe -version >/dev/null && 7zz i >/dev/null && mkvpropedit --version >/dev/null'
          docker logs smoke | tail -20
