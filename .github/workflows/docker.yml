name: Docker image

# Multi-arch image (linux/amd64 + linux/arm64) on GitHub Container Registry.
# - Tags v*: pushed as :<version> (e.g. :0.9.0-beta), plus :beta for pre-releases and :latest for stable releases.
# - Daily at 08:00 UTC (4 am Toronto summer time): the nightly branch as :nightly and :nightly-<commit>, skipped when
#   that commit already has an image. Run it by hand with workflow_dispatch + "nightly".
# - Pull requests: built for both platforms, not pushed (a build check).
on:
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Build the nightly branch now
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/animearr

jobs:
  image:
    runs-on: ubuntu-latest
    # Pushing needs packages: write; pull requests only build.
    permissions:
      contents: read
      packages: write
    env:
      NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.nightly == true) && 'nightly' || '' }}
          persist-credentials: false
      - name: Nightly commit
        id: nightly
        if: env.NIGHTLY == 'true'
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:nightly-$short" >/dev/null 2>&1; then
            echo "Nightly $short already has an image; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.nightly.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.nightly.outputs.skip != 'true'
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && steps.nightly.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        if: steps.nightly.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=nightly,enable=${{ env.NIGHTLY == 'true' }}
            type=raw,value=nightly-${{ steps.nightly.outputs.short }},enable=${{ env.NIGHTLY == 'true' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=AnimeArr
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Build (and push on tags and nightly)
        if: steps.nightly.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ANIMEARR_BUILD=${{ steps.nightly.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64 --load -t animearr:test .
          docker run -d --name smoke -e PUID=1000 -e PGID=1000 -p 8484:8484 animearr:test
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8484/ping && break; sleep 2; done
          curl -fs http://127.0.0.1:8484/ping
          docker exec smoke sh -c 'ffprobe -version >/dev/null && 7zz i >/dev/null && mkvpropedit --version >/dev/null'
          docker logs smoke | tail -20
