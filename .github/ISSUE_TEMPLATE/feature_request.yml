name: Feature idea
description: Something AnimeArr could do (or do better)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: other
    attributes:
      label: How do Sonarr/Radarr or other tools handle it (if they do)?
