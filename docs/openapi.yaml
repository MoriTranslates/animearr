# AnimeArr API reference (OpenAPI 3.1). See docs/API.md for the guide.
openapi: "3.1.0"
info:
  title: "AnimeArr API"
  version: "1.0.0-draft"
  summary: "AnimeArr's own HTTP API (not the Sonarr-compatible /api/v3 layer)."
  description: |-
    AnimeArr's own JSON API under `/api`, plus the iCalendar feed at `/feed/calendar/animearr.ics`. It is the API the AnimeArr web UI uses.

    **Stability.** Every operation carries `x-stability`. `stable` operations are the ones meant for integrations: their documented fields will not be removed or change meaning within 1.x without notice (new fields can appear). `internal` operations are what the web UI needs; they can change or disappear in any release. Most operations are internal today.

    **Authentication.** Send your API key as the `X-Api-Key` header or the `apikey` query parameter. Find it in Settings -> Security -> API key for other apps. Browser sessions (cookie) also work and must send `X-AnimeArr: 1` on writes; API-key requests are exempt from that rule. The API key only works on operations marked `x-stability: stable` (and the Sonarr-compatible `/api/v3`); every other operation answers 403 to it and needs a browser session.

    **Errors.** Failures return an HTTP status of 400 or above and a JSON body `{ "error": "..." }`.

    **Times.** Fields named `at`, `airUtc`, `updatedAt` and similar are milliseconds since the Unix epoch. A few fields that come straight from a search or from Sonarr (`publishDate`, `nextAiring`) are ISO 8601 strings.

    **URL base.** If AnimeArr runs under a sub-path behind a reverse proxy (for example `/animearr`), put it before every path in this document.

    Paths in this file are written without the URL base. The Sonarr v3-compatible layer under `/api/v3` is intentionally not described here; see docs/API.md.
  license:
    name: "See LICENSE in the repository"
servers:
  - url: "http://animearr:8484"
    description: "Default port; replace with your address (and URL base, if any)."
tags:
  - name: System
    description: "Server status, health, logs and backups."
  - name: Auth
    description: "Browser sign-in and account."
  - name: Settings
    description: "Settings and connection tests."
  - name: Library
    description: "Shows in the library."
  - name: Movies
    description: "Anime movies."
  - name: Add
    description: "Finding and adding titles."
  - name: Search
    description: "Searching for releases and grabbing them."
  - name: Queue
    description: "Downloads in progress and finished."
  - name: Calendar
    description: "Air dates."
  - name: Wanted
    description: "Missing episodes."
  - name: Activity
    description: "The activity log and notifications."
  - name: Blocklist
    description: "Releases that will not be grabbed again."
  - name: Tags
    description: "Tags and release rules."
  - name: Profiles
    description: "Language profiles and quality goals."
  - name: "Managed shows"
    description: "Shows AnimeArr searches for automatically."
  - name: Audit
    description: "Audits and per-show corrections."
  - name: Import
    description: "Importing downloads, renaming, media-server files."
  - name: Downloads
    description: "Free-space rules and clean-up."
  - name: "Indexers & clients"
    description: "Indexers and download clients."
  - name: "Notification channels"
    description: "Webhook, Telegram, Pushover and email channels."
  - name: "Import lists"
    description: "AniList and MyAnimeList lists."
  - name: Migration
    description: "Moving shows over from Sonarr and Radarr."
security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []
  - SessionCookie: []
paths:
  "/ping":
    get:
      operationId: getPing
      tags:
        - System
      summary: "Liveness check"
      description: "Public; no authentication. Returns `{ \"status\": \"OK\" }`."
      x-stability: stable
      security: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
        "4XX":
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
  "/api/status":
    get:
      operationId: getStatus
      tags:
        - System
      summary: "Version, auth state and a library/queue summary"
      description: "Reachable without credentials, so a client can check the server is AnimeArr and whether its key works: send your key and look at `loggedIn`. Without a valid credential you get only `version`, `build`, `setupRequired` and `loggedIn: false` (HTTP 200, not 401)."
      x-stability: stable
      security: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Status"
        "4XX":
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
  "/api/connections":
    get:
      operationId: getConnections
      tags:
        - System
      summary: "Health of clients, indexers and services"
      description: "Each service has `configured` and `ok` (`null` when not configured). `error` is a plain-English reason when `ok` is false."
      x-stability: stable
      parameters:
        - name: fresh
          in: query
          required: false
          description: "`1` bypasses the 20-second cache."
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Connections"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system":
    get:
      operationId: getSystem
      tags:
        - System
      summary: "Version, uptime, background jobs, database state, backups"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SystemInfo"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/logs":
    get:
      operationId: getSystemLogs
      tags:
        - System
      summary: "Recent log lines (secrets scrubbed)"
      x-stability: internal
      parameters:
        - name: level
          in: query
          required: false
          description: "Minimum level."
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: "Text filter."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Default 500."
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/logs/download":
    get:
      operationId: getSystemLogsDownload
      tags:
        - System
      summary: "Download the log as text"
      x-stability: internal
      responses:
        "200":
          description: "Plain text log."
          content:
            "text/plain":
              schema:
                type: string
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/metadata":
    post:
      operationId: postSystemMetadata
      tags:
        - System
      summary: "Refresh metadata sources now"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/updates":
    get:
      operationId: getSystemUpdates
      tags:
        - System
      summary: "Newest release on GitHub"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "`{ offline: true }` when GitHub cannot be reached."
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/backup":
    post:
      operationId: postSystemBackup
      tags:
        - System
      summary: "Create a backup now"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                  - name
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/restore":
    post:
      operationId: postSystemRestore
      tags:
        - System
      summary: "Restore a backup by name"
      description: "Destructive. Refused with an API key: needs the account password."
      x-stability: internal
      x-refused-for-api-key: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
                  description: "Account password."
              required:
                - name
                - password
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "`{ ok, message }`. The server then exits so its supervisor restarts it."
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/backup/download":
    get:
      operationId: getSystemBackupDownload
      tags:
        - System
      summary: "Download a whole backup (database + secret key)"
      x-stability: internal
      x-refused-for-api-key: true
      responses:
        "200":
          description: "A gzip archive."
          content:
            "application/gzip":
              schema:
                type: string
                format: binary
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
    post:
      operationId: postSystemBackupDownload
      tags:
        - System
      summary: "Download a whole backup with the account password (also needed on the home network)"
      x-stability: internal
      x-refused-for-api-key: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: "A gzip archive."
          content:
            "application/gzip":
              schema:
                type: string
                format: binary
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/backup/upload":
    post:
      operationId: postSystemBackupUpload
      tags:
        - System
      summary: "Stage an uploaded backup for restore"
      description: "Send the archive as `application/octet-stream` (up to 256 MiB). Step one of two: restore with `/api/system/backup/restore-upload`."
      x-stability: internal
      x-refused-for-api-key: true
      requestBody:
        required: true
        content:
          "application/octet-stream":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  token:
                    type: string
                  appVersion:
                    type: string
                  schema:
                    type: integer
                  createdAt:
                    type: integer
                    format: int64
                    description: "Created (milliseconds since the Unix epoch, UTC)."
                  size:
                    type: integer
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/backup/restore-upload":
    post:
      operationId: postSystemBackupRestoreUpload
      tags:
        - System
      summary: "Restore a staged backup"
      x-stability: internal
      x-refused-for-api-key: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
                - token
                - password
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/system/cache/reset":
    post:
      operationId: postSystemCacheReset
      tags:
        - System
      summary: "Rebuild the library cache from Sonarr"
      x-stability: internal
      x-refused-for-api-key: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ok"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/img":
    get:
      operationId: getImg
      tags:
        - System
      summary: "Poster thumbnail proxy"
      x-stability: internal
      parameters:
        - name: u
          in: query
          required: true
          description: "Source image URL (known image hosts only)."
          schema:
            type: string
        - name: s
          in: query
          required: false
          description: Size.
          schema:
            type: string
            enum:
              - sm
              - md
              - lg
              - xl
      responses:
        "200":
          description: "The image."
          content:
            "image/*":
              schema:
                type: string
                format: binary
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/phone":
    get:
      operationId: getPhone
      tags:
        - System
      summary: "Addresses a phone on the network can use"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  externalUrl:
                    type: string
                  lan:
                    type: array
                    items:
                      type: string
                  bypassLocal:
                    type: boolean
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/catalog":
    get:
      operationId: getCatalog
      tags:
        - System
      summary: "Status of the local anime catalog"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/catalog/refresh":
    post:
      operationId: postCatalogRefresh
      tags:
        - System
      summary: "Refresh the anime catalog"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/catalog/indexers":
    get:
      operationId: getCatalogIndexers
      tags:
        - System
      summary: "Built-in indexer catalog"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/anidb":
    get:
      operationId: getAnidb
      tags:
        - System
      summary: "AniDB lookup status"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/repair/recent":
    get:
      operationId: getRepairRecent
      tags:
        - System
      summary: "Recent after-import checks"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/repair/run":
    post:
      operationId: postRepairRun
      tags:
        - System
      summary: "Run the after-import check now"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/auth/login":
    post:
      operationId: postAuthLogin
      tags:
        - Auth
      summary: "Sign in and get a session cookie"
      description: "For browsers. Integrations should use the API key instead. Wrong credentials give 401; repeated failures from one address are slowed down (429). While the default password is unchanged, login only works from the home network (403 otherwise)."
      x-stability: internal
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ok"
        "4XX":
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
  "/api/auth/logout":
    post:
      operationId: postAuthLogout
      tags:
        - Auth
      summary: "Clear the session cookie"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ok"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/auth/account":
    put:
      operationId: putAuthAccount
      x-refused-for-api-key: true
      tags:
        - Auth
      summary: "Change username and password"
      x-stability: internal
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  description: "At least 8 characters; not the default."
              required:
                - currentPassword
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ok"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/auth/mode":
    put:
      operationId: putAuthMode
      tags:
        - Auth
      summary: "Turn the local-network no-password mode on or off"
      description: "Refused with an API key (403): this needs a signed-in browser session."
      x-stability: internal
      x-refused-for-api-key: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                bypassLocal:
                  type: boolean
              required:
                - bypassLocal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ok"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/settings":
    get:
      operationId: getSettings
      tags:
        - Settings
      summary: "All settings (secrets masked)"
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
    put:
      operationId: putSettings
      x-refused-for-api-key: true
      tags:
        - Settings
      summary: "Update settings"
      description: "Returns the new settings. Validation problems give 400 with an `error`."
      x-stability: internal
      requestBody:
        required: true
        description: "Any subset of the sections. A masked secret means \"unchanged\"."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Settings"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/settings/apikey":
    get:
      operationId: getSettingsApikey
      tags:
        - Settings
      summary: "Read the API key"
      description: "Returns the key only to a signed-in browser session. With an API key (or the local-network bypass) `apiKey` is `null`. Read your key in Settings -> Security."
      x-stability: internal
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  apiKey:
                    type:
                      - string
                      - "null"
                required:
                  - apiKey
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/settings/apikey/regenerate":
    post:
      operationId: postSettingsApikeyRegenerate
      tags:
        - Settings
      summary: "Make a new API key"
      description: "The old key stops working at once. Refused with an API key (403): this needs a signed-in browser session."
      x-stability: internal
      x-refused-for-api-key: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                required:
                  - apiKey
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Error"
  "/api/test/{service}":
    post:
      operationId: postTestService
      tags:
        - Settings
      summary: "Test a service connection with unsaved values"
      description: "A saved secret is only reused when the address is unchanged."
      x-stability: internal
      parameters:
        - name: service
          in: path
          required: true
          description: "Service key: `sonarr`, `radarr`, `prowlarr`, `sabnzbd`, `qbittorrent`, `plex`, `jellyfin`, `emby`, `kodi`, `tmdb`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              additionalProperties: true
              description: "`{ url, apiKey, username, password, category }` as relevant for the service."
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
                description: "Service-specific result, e.g. `{ version }`."
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/test/tmdb":
    post:
      operationId: postTestTmdb
      tags:
        - Settings
      summary: "Test a TMDB key"
      x-stability: internal
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                key:
                  type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                additionalProperties: true
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/rootfolders":
    get:
