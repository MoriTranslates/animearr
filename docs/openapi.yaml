            schema:
              type: object
              properties:
                tvdbId:
                  type: integer
                episodeIds:
                  type: array
                  items:
                    type: integer
                    description: "Episode ids from `/api/series/{tvdbId}`. A season is its episodes' ids."
              required:
                - tvdbId
                - episodeIds
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AutoSearchQueued"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        default:
          "$ref": "#/components/responses/Error"
  "/api/autosearch/jobs":
    get:
      operationId: getAutosearchJobs
      tags:
        - Search
      summary: "Automatic-search jobs and their outcomes"
      description: "Jobs started by `POST /api/autosearch` and `POST /api/movies/{id}/autosearch`: running first, then waiting, then the ones that finished in the last hour (newest first, at most 30). `searching` lists the episode ids being searched right now. Jobs are kept in memory: a restart drops unfinished ones. Poll every few seconds at most, and only while a job is `queued` or `running`."
      x-stability: stable
      responses:
        "200":
