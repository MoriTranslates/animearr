      tags:
        - Search
      summary: "Search for episodes and grab the best release automatically"
      description: "The same decision the scheduler makes: rank the indexers' results and grab the best acceptable one, or report why none qualified. Answers at once: the search runs in the background as a job; follow it with `GET /api/autosearch/jobs` (its outcomes also go to `/api/activity`). An episode already being searched by an earlier call is skipped (`already being searched`). Up to 26 episodes per call; the rest are handed to the scheduled searches. In practice mode the outcome is `would-grab` and nothing is downloaded. 403 when the show is outside the allowed root folders, 404 for an unknown show. 400 if no indexer is configured."
