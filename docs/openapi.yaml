components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "AnimeArr's API key (Settings -> Security -> API key for other apps)."
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: "The same key as a query parameter, for clients that cannot set headers. It can end up in proxy and browser logs; prefer the header."
    SessionCookie:
      type: apiKey
      in: cookie
      name: animearr_session
      description: "Set by `POST /api/auth/login`. Writes from a browser must also send the header `X-AnimeArr: 1` and, if an `Origin` header is present, it must match the host. Meant for the web UI, not for integrations."
  responses:
    Error:
      description: Error
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: "No valid credential (`{ \"error\": \"Login required\" }`), or no account exists yet (`setupRequired: true`)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: "Refused for API-key authentication, or a cross-site browser request was blocked."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: "A plain-English message. Safe to show to a user."
        detail:
          type: string
          description: "Raw technical text behind `error`, when there is one (connection errors)."
        fixes:
          type: array
          items:
            type: object
            additionalProperties: true
            description: "A suggested fix the web UI renders as a button: `{ action, label, params? }`."
      required:
        - error
      description: "Every error response has this shape. Some also carry extra keys, e.g. `setupRequired` on a 401 before an account exists."
    Status:
      type: object
      properties:
        version:
          type: string
          description: "AnimeArr version. Nightly builds carry the commit: `0.10.0-nightly+1a2b3c4`."
        build:
          type:
            - string
            - "null"
          description: "Hashed name of the web build being served."
        setupRequired:
          type: boolean
          description: "True until an account exists."
        loggedIn:
          type: boolean
          description: "True when this request is authenticated (API key, session, or the local-network bypass)."
        via:
          type: string
          enum:
            - apikey
            - session
            - local
          description: "How this request was authenticated. Present only when `loggedIn` is true."
        connected:
          type: object
          properties:
            sonarr:
              type: boolean
            radarr:
              type: boolean
            prowlarr:
              type: boolean
            sabnzbd:
              type: boolean
            qbittorrent:
              type: boolean
          description: "Which services have an address and key saved (not whether they answer; see `/api/connections`)."
        dryRun:
          type: boolean
          description: "The global practice-mode switch: when true, nothing is really downloaded."
        grabsPaused:
          type:
            - object
            - "null"
          properties:
            why:
              type: string
            diskRule:
              type: boolean
          additionalProperties: true
          description: "Present when downloads are paused (for example by a free-space rule)."
        allowedRoots:
          type: array
          items:
            type: string
        lastSync:
          type:
            - integer
            - "null"
          format: int64
          description: "When the library was last synced from Sonarr (milliseconds since the Unix epoch, UTC)."
        syncing:
          type: boolean
        managed:
          type: integer
          description: "Number of managed shows."
        librarySeries:
          type: integer
          description: "Number of shows in the library."
        warnings:
          type: array
          items:
            type: string
        queue:
          type: object
          properties:
            active:
              type: integer
              description: "Downloads sending, downloading or importing."
            attention:
              type: integer
              description: "Downloads that need a look."
          required:
            - active
            - attention
        airingShows:
          type: integer
          description: "Shows with an episode airing this week or last."
        defaultPassword:
          type: boolean
          description: "The account still uses the default password."
        bypassLocal:
          type: boolean
          description: "\"No password on my local network\" is on."
        wizardDone:
          type: boolean
        freshInstall:
          type: boolean
        uiLanguage:
          type: string
      required:
        - version
        - setupRequired
        - loggedIn
      description: "Fields after `loggedIn` are only present when the request is authenticated. Unauthenticated callers get `version`, `build`, `setupRequired`, `loggedIn` (and `defaultLogin` on the home network)."
    Show:
      type: object
      properties:
        seriesId:
          type: integer
          description: "Internal id (the Sonarr series id for shows imported from Sonarr). Prefer `tvdbId`."
        tvdbId:
          type: integer
          description: "TVDB id. The id used in every `/api/series/{tvdbId}` path."
        title:
          type: string
        path:
          type: string
          description: "Folder on disk."
        status:
          type: string
          description: "`continuing`, `ended`, `upcoming` or `deleted`."
        monitored:
          type: boolean
        tags:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        cover:
          type:
            - string
            - "null"
          description: "Poster image URL."
        network:
          type:
            - string
            - "null"
        airingThisSeason:
          type: boolean
        episodesThisSeason:
          type: integer
        nextAiring:
          type:
            - string
            - "null"
          description: "ISO 8601 date-time of the next episode."
        anidb:
          type: string
          description: "AniDB mapping state."
        allowed:
          type: boolean
          description: "The show sits under an allowed root folder; AnimeArr only acts on those."
        managed:
          type: boolean
          description: "AnimeArr searches for and grabs this show's episodes automatically."
        dryRun:
          type: boolean
          description: "This show is in practice mode."
      required:
        - tvdbId
        - title
    ShowSearchHit:
      type: object
      properties:
        tvdbId:
          type: integer
        title:
          type: string
        status:
          type: string
        year:
          type:
            - integer
            - "null"
        cover:
          type:
            - string
            - "null"
      required:
        - tvdbId
        - title
    Episode:
      type: object
      properties:
        id:
          type: integer
          description: "Episode id (Sonarr episode id for Sonarr-synced shows)."
        season:
          type: integer
          description: "0 is specials."
        episode:
          type: integer
        absolute:
          type:
            - integer
            - "null"
          description: "Absolute number across seasons."
        sceneSeason:
          type:
            - integer
            - "null"
        sceneEpisode:
          type:
            - integer
            - "null"
        sceneAbsolute:
          type:
            - integer
            - "null"
        airUtc:
          type:
            - integer
            - "null"
          format: int64
          description: "Air time (milliseconds since the Unix epoch, UTC)."
        title:
          type:
            - string
            - "null"
        hasFile:
          type: boolean
        monitored:
          type: boolean
        runtime:
          type:
            - integer
            - "null"
          description: Minutes.
      required:
        - id
        - season
        - episode
    FileInfo:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
        name:
          type: string
        size:
          type:
            - integer
            - "null"
          description: Bytes.
        quality:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        group:
          type:
            - string
            - "null"
        sceneName:
          type:
            - string
            - "null"
        subs:
          type: array
          items:
            type: string
            description: "Subtitle language codes."
        audio:
          type: array
          items:
            type: string
            description: "Audio language codes."
        runTime:
          type:
            - string
            - "null"
        resolution:
          type:
            - string
            - "null"
        episodes:
          type: array
          items:
            type: string
            description: "`S01E02`-style labels."
        codec:
          type:
            - string
            - "null"
      additionalProperties: true
    EpisodeRow:
      type: object
      properties:
        id:
          type: integer
        season:
          type: integer
        episode:
          type: integer
        absolute:
          type:
            - integer
            - "null"
        title:
          type:
            - string
            - "null"
        airUtc:
          type:
            - integer
            - "null"
          format: int64
          description: "Air time (milliseconds since the Unix epoch, UTC)."
        runtime:
          type:
            - integer
            - "null"
        monitored:
          type: boolean
        status:
          type: string
          enum:
            - have
            - missing
            - downloading
            - unaired
            - attention
          description: "Where the episode stands."
        progress:
          type:
            - number
            - "null"
          description: "Download progress, 0 to 1."
        file:
          "$ref": "#/components/schemas/FileInfo"
          type:
            - undefined
            - "null"
        stage:
          type:
            - string
            - "null"
        ahead:
          type:
            - integer
            - "null"
        special:
          type:
            - object
            - "null"
          properties:
            type:
              type: string
            cls:
              type: string
        missingWhy:
          type:
            - string
            - "null"
          description: "What the last automatic search found, e.g. nothing with English subs."
      required:
        - id
        - season
        - episode
        - status
      additionalProperties: true
    SeriesDetail:
      type: object
      properties:
        id:
          type: integer
          description: "Internal series id."
        tvdbId:
          type: integer
        title:
          type: string
        path:
          type: string
        originalLanguage:
          type:
            - string
            - "null"
        cover:
          type:
            - string
            - "null"
        managed:
          type:
            - object
            - "null"
          additionalProperties: true
          description: "The managed-show record, or null when the show is not managed."
        episodes:
          type: array
          items:
            "$ref": "#/components/schemas/Episode"
        rows:
          type: array
          items:
            "$ref": "#/components/schemas/EpisodeRow"
        header:
          type:
            - object
            - "null"
          additionalProperties: true
          description: "Summary used by the show page header: counts, next airing, banner, language verdicts."
        prefs:
          type: object
          additionalProperties: true
          description: "Language profile / watch mode / size preset chosen for this show."
        tags:
          type: array
          items:
            type: integer
            description: "Tag ids."
        schedule:
          type: array
          items:
            type: object
            additionalProperties: true
            description: "Upcoming automatic searches for this show."
        aliases:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        facts:
          type: array
          items:
            type: object
            additionalProperties: true
        anidb:
          type: array
          items:
            type: object
            additionalProperties: true
        movies:
          type: array
          items:
            type: object
            additionalProperties: true
            description: "Related movies."
      required:
        - tvdbId
        - title
        - episodes
      additionalProperties: true
      description: "`episodes` is the plain list; `rows` is the richer per-episode view (status, file, download progress)."
    CalendarEntry:
      type: object
      properties:
        episodeId:
          type: integer
        tvdbId:
          type: integer
        series:
          type: string
        cover:
          type:
            - string
            - "null"
        season:
          type: integer
        episode:
          type: integer
        title:
          type:
            - string
            - "null"
        airUtc:
          type: integer
          format: int64
          description: "Air time (milliseconds since the Unix epoch, UTC)."
        status:
          type: string
          enum:
            - have
            - missing
            - downloading
            - unaired
            - attention
        progress:
          type:
            - number
            - "null"
        stage:
          type:
            - string
            - "null"
        ahead:
          type:
            - integer
            - "null"
        managed:
          type: boolean
      required:
        - episodeId
        - tvdbId
        - series
        - season
        - episode
        - airUtc
        - status
    MovieCalendarEntry:
      type: object
      properties:
        movieId:
          type: integer
        title:
          type: string
        year:
          type:
            - integer
            - "null"
        cover:
          type:
            - string
            - "null"
